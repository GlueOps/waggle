# Yarn 4 (berry) config for the frontend. Mirrors the maintainer's global
# ~/.yarnrc.yml so a clean checkout, CI, and the Docker image build all behave
# the same as a developer machine (neither CI nor the image has a global yarn
# config).

# node_modules rather than PnP: vite/tsc/eslint all resolve normally, and the
# Docker build copies node_modules between stages.
nodeLinker: node-modules

nmHoistingLimits: workspaces

# Keep the cache outside the project: faster reinstalls, nothing to gitignore.
enableGlobalCache: true

# Fail on tarball checksum mismatches rather than silently accepting them.
checksumBehavior: throw

# No npmMinimalAgeGate here on purpose. Matching the parent Renovate config's
# `minimumReleaseAge: 30 days` at the yarn level is incompatible with this
# project: :pinDevDependencies pins exact versions (15 of 28 deps), so a pin
# newer than the gate has NO satisfying version and resolution hard-fails
# ("All versions satisfying @tailwindcss/vite@4.3.3 are quarantined") instead
# of falling back to an older release. Package-age policy stays with Renovate,
# which applies it at PR time where a violation defers a PR rather than
# breaking the image build.

compressionLevel: mixed

enableTelemetry: false
