name: CI

# Runs the test suite and build checks on every PR and push to main.
#
# The Docker Publish workflow only proves the image builds; it does not run a
# single test. This is the workflow that actually gates correctness.
#
# Commit type note: the org-required glueops-basic-pr-checks workflow validates
# commit messages against fix,docs,style,refactor,test,chore,pref,ci,feat,
# breaking,major,revert. "build" is NOT allowed, which is why Dependabot PRs
# titled "build(deps): ..." can never merge here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref; the full matrix is not cheap.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Terraform provider used to be a second module in this matrix. It now
  # lives in its own repository (GlueOps/terraform-provider-waggle), which runs
  # the equivalent checks on its own CI; `waggle generate terraform
  # openapi-generator` writes into a checkout of it.
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # ui/dist/.gitkeep keeps the //go:embed directive in ui/embed.go valid, so
      # the Go build and tests work without building the frontend first.
      - name: Verify go.mod is tidy
        run: |
          cp go.mod go.mod.orig
          cp go.sum go.sum.orig
          go mod tidy
          if ! diff -q go.mod go.mod.orig >/dev/null || ! diff -q go.sum go.sum.orig >/dev/null; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            diff -u go.mod.orig go.mod || true
            diff -u go.sum.orig go.sum || true
            exit 1
          fi
          rm -f go.mod.orig go.sum.orig

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector, coverage)
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: |
          echo "### Go coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -30 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # corepack must be enabled BEFORE setup-node: its `cache: yarn` probe
      # shells out to the global yarn, which refuses to run at all once
      # package.json declares packageManager: yarn@4.x ("the current global
      # version of Yarn is 1.22.22").
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: ui/yarn.lock

      # --immutable is yarn 4's --frozen-lockfile: it fails if yarn.lock is out
      # of sync with package.json, which is exactly the drift that broke every
      # build on main between 3fb8102 and #26. The yarn version comes from
      # packageManager, so corepack activates whatever is pinned there.
      - name: Install
        working-directory: ui
        run: yarn install --immutable

      - name: Lint
        working-directory: ui
        run: yarn lint

      # `yarn build` runs `tsc -b && vite build`, so this type-checks too.
      - name: Build
        working-directory: ui
        run: yarn build

  sdk-ts:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      # sdk/ts has no lockfile (it is generated output), so install the declared
      # devDependency range directly. This job exists because nothing else
      # compiles sdk/ts — a TypeScript regression here is invisible otherwise,
      # and it ships to consumers via the "prepare" script on install.
      - name: Install TypeScript
        working-directory: sdk/ts
        run: npm install --no-save typescript@"$(node -p 'require("./package.json").devDependencies.typescript')"

      - name: Build (CJS + ESM)
        working-directory: sdk/ts
        run: npm run build

      - name: Verify build output
        working-directory: sdk/ts
        run: |
          for f in dist/index.js dist/index.d.ts dist/esm/index.js; do
            if [ ! -f "$f" ]; then
              echo "::error::expected build artifact $f is missing"
              exit 1
            fi
          done
