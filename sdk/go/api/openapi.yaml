openapi: 3.1.0
info:
  description: Waggle API.
  title: Waggle
  version: 0.2.2
servers:
- url: /api/v1
paths:
  /api-keys:
    get:
      operationId: list-api-keys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAPIKeysOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: List the organization's API keys (secrets are never returned).
      tags:
      - api-keys
    post:
      operationId: create-api-key
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAPIKeyOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Mint an organization API key for automation (e.g. Terraform). The plaintext
        token is returned once.
      tags:
      - api-keys
  /api-keys/{id}:
    delete:
      operationId: revoke-api-key
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Revoke an organization API key. Idempotent from the caller's view.
      tags:
      - api-keys
  /auth/accept-invite:
    post:
      operationId: auth-accept-invite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Accept an organization invite: set a password (if new) and sign in\
        \ to the org."
      tags:
      - auth
  /auth/login:
    post:
      operationId: auth-login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Exchange credentials for an access + refresh token. Returns membership
        list when no organization_id is given and multiple memberships exist.
      tags:
      - auth
  /auth/logout:
    post:
      operationId: auth-logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke the supplied refresh token's session. Idempotent.
      tags:
      - auth
  /auth/me:
    get:
      operationId: auth-me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: "Return the authenticated account, its verified-or-pending emails,\
        \ and its org memberships."
      tags:
      - auth
  /auth/refresh:
    post:
      operationId: auth-refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Rotate a refresh token, returning a new access + refresh pair."
      tags:
      - auth
  /auth/signup:
    post:
      operationId: auth-signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Create an account, organization, and first user; enqueue tenant provisioning."
      tags:
      - auth
  /auth/switch:
    post:
      operationId: auth-switch-org
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchOrgInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Issue a new token pair scoped to another organization the account belongs
        to.
      tags:
      - auth
  /auth/verify-email:
    post:
      operationId: auth-verify-email
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Consume a verification token to mark an email address verified. Idempotent.
      tags:
      - auth
  /datacenters:
    get:
      operationId: list-datacenters
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatacenterListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: List datacenters in the caller's tenant.
      tags:
      - datacenters
    post:
      operationId: create-datacenter
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatacenterBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatacenterView"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Create a datacenter in the caller's tenant.
      tags:
      - datacenters
  /datacenters/{id}:
    delete:
      operationId: delete-datacenter
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Delete a datacenter.
      tags:
      - datacenters
    get:
      operationId: get-datacenter
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatacenterView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Fetch a datacenter by ID.
      tags:
      - datacenters
    put:
      operationId: update-datacenter
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatacenterBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatacenterView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Update a datacenter.
      tags:
      - datacenters
  /datacenters/{id}/discover:
    post:
      operationId: discover-hypervisors
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Discover hypervisors from the datacenter's Proxmox cluster and upsert
        them (preserving reserved capacity and schedulable). Set async to run in the
        background.
      tags:
      - datacenters
  /health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check
      tags:
      - system
  /hypervisors:
    get:
      operationId: list-hypervisors
      parameters:
      - explode: false
        in: query
        name: datacenter_id
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypervisorListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: List hypervisors in the caller's tenant.
      tags:
      - hypervisors
    post:
      operationId: create-hypervisor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HypervisorBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypervisorView"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Create a hypervisor in the caller's tenant.
      tags:
      - hypervisors
  /hypervisors/{id}:
    delete:
      operationId: delete-hypervisor
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Delete a hypervisor.
      tags:
      - hypervisors
    get:
      operationId: get-hypervisor
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypervisorView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Fetch a hypervisor by ID.
      tags:
      - hypervisors
    put:
      operationId: update-hypervisor
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HypervisorBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypervisorView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Update a hypervisor.
      tags:
      - hypervisors
  /organizations:
    get:
      operationId: list-orgs
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: List the organizations the caller belongs to (with their role).
      tags:
      - organizations
    post:
      operationId: create-org
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgFullView"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Create an organization (you become its owner) and enqueue tenant provisioning.
      tags:
      - organizations
  /organizations/{id}:
    delete:
      operationId: delete-org
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Delete an organization and enqueue tenant teardown (owner only).
      tags:
      - organizations
    get:
      operationId: get-org
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgFullView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Get an organization the caller belongs to.
      tags:
      - organizations
    patch:
      operationId: update-org
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgFullView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Rename an organization (admin or owner).
      tags:
      - organizations
  /organizations/{id}/members:
    get:
      operationId: list-members
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: List an organization's members.
      tags:
      - organizations
    post:
      operationId: add-member
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddMemberOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Add or invite a member by email (admin+; owner required to grant owner).
        Unknown emails get an invite link.
      tags:
      - organizations
  /organizations/{id}/members/{userId}:
    delete:
      operationId: remove-member
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Remove a member (admin+; owner required to remove owners; never the
        last owner).
      tags:
      - organizations
    patch:
      operationId: update-member
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberJSONView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Change a member's role (admin+; owner required to touch owners).
      tags:
      - organizations
  /placements:
    get:
      operationId: list-placements
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetPlacementListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: "List all placements in the tenant with pool, slot, and hypervisor\
        \ context (fleet overview)."
      tags:
      - placements
  /placements/{id}:
    delete:
      operationId: delete-placement
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Remove a placement. The pool's desired_count is not adjusted; resize
        the pool to re-fill the vacancy.
      tags:
      - placements
    get:
      operationId: get-placement
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: "Fetch a single placement with its pool, hypervisor, and vmid."
      tags:
      - placements
    patch:
      operationId: backfill-placement-vmid
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackfillVMIDInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Attach the externally-assigned Proxmox vmid to a placement.
      tags:
      - placements
  /pools:
    get:
      operationId: list-pools
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: List node pools in the caller's tenant.
      tags:
      - pools
    post:
      operationId: create-pool
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePoolInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolView"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: "Create a node pool and place its VMs across hypervisors (anti-affinity\
        \ spread, all-or-nothing). Placements are available at GET /pools/{id}/placements."
      tags:
      - pools
  /pools/{id}:
    delete:
      operationId: delete-pool
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: Delete a pool and release all its placements.
      tags:
      - pools
    get:
      operationId: get-pool
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearer: []
      summary: "Fetch a pool. Its placements are available at GET /pools/{id}/placements."
      tags:
      - pools
    patch:
      operationId: resize-pool
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
