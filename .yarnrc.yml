# Yarn 4 (berry) config for the root toolchain project, which exists only to
# pin the JS code generators invoked by `waggle generate sdk`. Mirrors the
# maintainer's global ~/.yarnrc.yml so a clean checkout and CI behave the same
# as a developer machine (CI has no global yarn config).
#
# approvedGitRepositories / enableScripts were written by yarn's v1 -> berry
# migration to preserve yarn-1 semantics.

approvedGitRepositories:
  - "**"

# Fail on tarball checksum mismatches rather than silently accepting them.
checksumBehavior: throw

compressionLevel: mixed

enableGlobalCache: true

enableScripts: true

enableTelemetry: false

nmHoistingLimits: workspaces

# node_modules rather than PnP: generate.go execs node_modules/.bin/openapi-ts
# directly, and PnP would leave no such path.
nodeLinker: node-modules

# npmMinimalAgeGate is deliberately left at 0 (yarn's v1 -> berry migration
# wrote it). Setting it to 30d to match the parent Renovate config's
# `minimumReleaseAge` is incompatible with this repo: :pinDevDependencies pins
# exact versions, so a pin newer than the gate has NO satisfying version and
# resolution hard-fails ("All versions satisfying X are quarantined") rather
# than falling back. Package-age policy is enforced by Renovate at PR time,
# where a violation defers a PR instead of breaking the build.
npmMinimalAgeGate: 0
